# Mise à jour quotidienne de la matrice de risque MVB et publication sur GitHub Pages
name: Mise à jour de la matrice

on:
  schedule:
    - cron: "0 5 * * *"        # chaque jour à 05:00 UTC (07:00 à Bukavu / Lubumbashi)
  workflow_dispatch:            # bouton « Run workflow » pour une mise à jour immédiate
  push:
    paths:
      - "donnees_terrain/**"    # recalcul dès que l'équipe modifie la sécurité ou les zones ORACLE
      - "R/**"
      - "modele/**"
      - "outils/**"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::dplyr
            any::tidyr
            any::readr
            any::jsonlite
            any::curl
            any::sf
            any::MASS
            any::EpiEstim

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer Playwright (pour le PDF)
        run: pip install playwright

      - name: Télécharger les données (INSP/INRB-UMIE, ACLED)
        env:
          ACLED_EMAIL: ${{ secrets.ACLED_EMAIL }}
          ACLED_PASSWORD: ${{ secrets.ACLED_PASSWORD }}
        run: Rscript R/01_telecharger.R

      - name: Calculer la matrice
        run: Rscript R/02_analyse.R

      - name: Construire la page et le PDF
        run: python outils/construire_page.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  publier:
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
